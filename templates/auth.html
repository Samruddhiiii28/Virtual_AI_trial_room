{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card card-body shadow-sm">
<h4>{{ 'Create account' if mode=='register' else 'Login' }}</h4><form method="post">
{% if mode=='register' %}<input class="form-control mb-2" name="name" placeholder="Full name" required>{% endif %}
<input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
<input class="form-control mb-2" type="password" name="password" placeholder="Password" required>
{% if mode=='register' %}<div class="row g-2 mb-2"><div class="col"><select name="gender" class="form-select"><option value="male">Male</option><option value="female">Female</option></select></div>
<div class="col"><input class="form-control" name="height" placeholder="Height cm" required></div><div class="col"><input class="form-control" name="weight" placeholder="Weight kg" required></div></div>{% endif %}
<button class="btn btn-primary w-100">{{ 'Register' if mode=='register' else 'Login' }}</button></form>
{% if mode=='login' %}<p class="small text-muted mt-3 mb-0">Demo: demo@trialroom.com / demo123</p>{% endif %}</div></div></div>{% endblock %}
